<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé Học Vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span>☁️</span><span>⭐</span><span>🎈</span><span>☁️</span></div>
<main id="app">
  <section id="s-auth" class="screen">
    <div class="owl big">🦉</div>
    <h1>Bé Học Vui</h1>
    <p class="sub">Cùng cú Mơ học Toán, Tiếng Việt và Tiếng Anh nhé!</p>
    <form id="authForm" class="card">
      <input id="email" type="email" placeholder="Email của bố mẹ" required autocomplete="email">
      <input id="password" type="password" placeholder="Mật khẩu (từ 6 ký tự)" minlength="6" required autocomplete="current-password">
      <p id="authMsg" class="msg" role="alert"></p>
      <button class="btn green" id="btnLogin" type="submit">Đăng nhập</button>
      <button class="btn ghost" id="btnRegister" type="button">Tạo tài khoản mới</button>
      <div class="or"><span>hoặc</span></div>
      <button class="btn google" id="btnGoogle" type="button">
        <svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Đăng nhập bằng Google
      </button>
    </form>
  </section>
  <div id="shell" class="shell hidden">
    <nav class="side" aria-label="Menu chính">
      <div class="brand"><span>🦉</span> Bé Học Vui</div>
      <button class="nav-btn on" data-view="s-home"><i>🏠</i><span>Trang chủ</span></button>
      <button class="nav-btn" data-view="s-history"><i>🕘</i><span>Lịch sử học</span></button>
      <button class="nav-btn" data-view="s-stats"><i>📊</i><span>Thống kê</span></button>
      <button class="nav-btn" data-view="s-info"><i>👤</i><span>Thông tin</span></button>
      <div class="stars">⭐ <b id="starCount">0</b></div>
    </nav>
    <div class="content">
      <section id="s-home" class="screen">
        <h2>Hôm nay bé học gì nào?</h2>
        <div class="subjects">
          <button class="subject blue" data-subject="math"><span>🧮</span>Toán</button>
          <button class="subject coral" data-subject="vi"><span>📖</span>Tiếng Việt</button>
          <button class="subject sun" data-subject="en"><span>🌍</span>Tiếng Anh</button>
        </div>
        <label class="ai-toggle"><input type="checkbox" id="useAI"> ✨ Bài tập do AI tạo mới</label>
      </section>

      <section id="s-history" class="screen hidden">
        <h2>Lịch sử học</h2>
        <div id="historyList" class="list"></div>
      </section>

      <section id="s-stats" class="screen hidden">
        <h2>Thống kê</h2>
        <div class="big3">
          <div class="tile">⭐<b id="stStars">0</b>sao</div>
          <div class="tile">📚<b id="stSessions">0</b>bài đã học</div>
          <div class="tile">🎯<b id="stRate">0%</b>đúng ngay lần đầu</div>
        </div>
        <div id="statSubjects" class="list"></div>
      </section>

      <section id="s-info" class="screen hidden">
        <h2>Thông tin</h2>
        <div class="card">
          <div class="row"><span class="e">✉️</span> <span id="infoEmail"></span></div>
          <div class="row"><span class="e">📅</span> <span id="infoSince"></span></div>
          <button class="btn ghost" id="btnLogout">Đăng xuất</button>
        </div>
      </section>

      <section id="s-quiz" class="screen hidden">
        <header class="top">
          <button class="icon" id="btnBack" aria-label="Về trang chủ">🏠</button>
          <div class="bar"><i id="barFill"></i></div>
          <div class="stars">⭐ <b id="quizStars">0</b></div>
        </header>
        <div class="card q">
          <div id="qEmoji" class="qemoji"></div>
          <h2 id="qPrompt"></h2>
          <button class="icon speak" id="btnSpeak" aria-label="Nghe đọc">🔊</button>
        </div>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section id="s-done" class="screen hidden">
        <div class="owl big">🏆</div>
        <h2>Giỏi quá!</h2>
        <p class="sub">Bé được <b id="doneStars">0</b> ⭐ trong bài này</p>
        <button class="btn green" id="btnAgain">Chơi tiếp</button>
        <button class="btn ghost" id="btnHome">Về trang chủ</button>
      </section>
    </div>
  </div>
</main>
<canvas id="fx"></canvas>
<script type="module" src="js/app.js"></script>
</body>
</html>
